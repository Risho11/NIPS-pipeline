name: Regenerate evaluation logs

# GitHub Pages serves docs/ with no build step -- it only shows whatever HTML is literally
# committed. Nothing regenerates fit_evaluation_log.html / quality_evaluation_log.html on its
# own, so pushing new campaign data alone left the hosted page stale until someone remembered to
# run the generator scripts locally and push the result. This closes that gap.
#
# Results include both campaign-level CSVs and nested reproducibility batches.
# Refresh when run plots arrive separately or the fit log generator changes.
# The bot's own docs/-only commit does not match these paths.
on:
  push:
    branches: [main]
    paths:
      - "data/results/**"
      - "data/plots/run-*/**"
      - "EVALUATE/generate_fit_log.py"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7

      - name: Check fit log generation
        run: uv run --no-project --python 3.11 --with 'pandas>=2.2,<3' python -m unittest discover -s tests -p 'test_fit*.py'

      - name: Regenerate fit + quality evaluation logs
        run: |
          uv run --no-project --python 3.11 --with 'pandas>=2.2,<3' python EVALUATE/generate_fit_log.py
          uv run --no-project --python 3.11 --with 'pandas>=2.2,<3' python EVALUATE/generate_quality_log.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to the logs -- nothing to commit."
          else
            git commit -m "Auto-regenerate evaluation logs [skip ci]"
            git push
          fi
