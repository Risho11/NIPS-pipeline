name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  check-changes:
    runs-on: ubuntu-latest
    outputs:
      processing_changed: ${{ steps.detect.outputs.changed }}
      csv_changed: ${{ steps.detect.outputs.csv_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        run: |
          DIFF=$(git diff --name-only HEAD~1 HEAD)
          if echo "$DIFF" | grep -qE "processing_29\.py|run_tests\.py|fake-data/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          if echo "$DIFF" | grep -qE "processing_29\.py|TESTS/test_csv\.py|TESTS/test_guardrails\.py"; then
            echo "csv_changed=true" >> $GITHUB_OUTPUT
          else
            echo "csv_changed=false" >> $GITHUB_OUTPUT
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for API keys
        run: |
          if grep -rn "sk-or-v1-\|sk-ant-\|sk-proj-" --include="*.py" .; then
            echo "FAIL: hardcoded API key found"
            exit 1
          fi
          echo "PASS no secrets found"

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q . -x "2025-07-02|minipc|\.venv"

  validate-params:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/validate_params.py

  validate-fake-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/validate_fake_data.py

  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check folder and import references
        run: python .github/scripts/validate_structure.py

  validate-run-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/validate_run_loop.py

  csv-tests:
    needs: [check-changes, secret-scan, syntax-check]
    if: needs.check-changes.outputs.csv_changed == 'true'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: CSV edge case tests
        run: python TESTS/test_csv.py
      - name: Guardrail tests
        run: python TESTS/test_guardrails.py

  smoke-test:
    needs: [check-changes, secret-scan, syntax-check, validate-structure, csv-tests]
    if: needs.check-changes.outputs.processing_changed == 'true'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test (single condition)
        run: python run_tests.py --condition short-nips-30s

  run-tests:
    needs: [check-changes, smoke-test, validate-params, validate-fake-data, validate-run-loop, validate-structure]
    if: needs.check-changes.outputs.processing_changed == 'true'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline tests
        run: python run_tests.py --skip nine-per-phase-1800s double-run-4-clusters multi-date-two-runs
